name: Daily Deadline Freshness Check

on:
  schedule:
    - cron: '30 1 * * *' # 1:30 AM UTC (Runs Daily 7:00 AM IST)
  workflow_dispatch: # Allows manual triggering from GitHub UI
    inputs:
      target:
        description: 'Database to update (staging = test run: live site untouched)'
        type: choice
        options: [production, staging]
        default: production

# Every workflow that writes the database shares this group, so they run one at a time
concurrency:
  group: database-writes
  cancel-in-progress: false

env:
  DB_TARGET: ${{ inputs.target || 'production' }}

jobs:
  check-deadlines:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scholarship-app/package-lock.json

      - name: Install dependencies
        run: |
          cd scholarship-app
          npm ci

      # Turso is the master copy: start from its latest data
      - name: Pull latest database from Turso
        run: node scholarship-app/scripts/pull-from-turso.js
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_STAGING_DATABASE_URL: ${{ secrets.TURSO_STAGING_DATABASE_URL }}
          TURSO_STAGING_AUTH_TOKEN: ${{ secrets.TURSO_STAGING_AUTH_TOKEN }}

      - name: Run Daily Deadline Verification (Gemini Flash)
        run: |
          node scholarship-app/scripts/daily-freshness-check.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NODE_ENV: production

      - name: Generate Daily Email Body
        run: |
          node scholarship-app/scripts/generate-email-reports.js --type daily

      - name: Send Email Report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "${{ env.DB_TARGET == 'staging' && '[STAGING] ' || '' }}Daily Scholarship Deadline Verification Report"
          to: bizmantra@gmail.com
          from: "India Scholarships Freshness Pipeline <${{ secrets.EMAIL_USERNAME }}>"
          secure: true
          html_body: file://${{ github.workspace }}/scholarship-app/data/daily-email-body.html

      - name: Normalize data formats
        run: node scholarship-app/scripts/clean-data-formats.js

      - name: Check data formats (blocks bad data from reaching Turso)
        run: node scholarship-app/scripts/check-data-formats.js

      - name: Back up Turso before syncing
        run: node scholarship-app/scripts/backup-turso.js --out=backups/pre-sync.db
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_STAGING_DATABASE_URL: ${{ secrets.TURSO_STAGING_DATABASE_URL }}
          TURSO_STAGING_AUTH_TOKEN: ${{ secrets.TURSO_STAGING_AUTH_TOKEN }}

      - name: Store pre-sync backup
        uses: actions/upload-artifact@v4
        with:
          name: pre-sync-backup-${{ env.DB_TARGET }}-${{ github.run_id }}
          path: backups/pre-sync.db
          retention-days: 7

      - name: Push Database to Turso
        run: |
          node scholarship-app/scripts/push-to-turso.js
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_STAGING_DATABASE_URL: ${{ secrets.TURSO_STAGING_DATABASE_URL }}
          TURSO_STAGING_AUTH_TOKEN: ${{ secrets.TURSO_STAGING_AUTH_TOKEN }}

      # Listing pages are built at deploy time, so rebuild the site once the data has changed
      - name: Trigger Vercel Redeployment
        if: env.DB_TARGET == 'production'
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
