name: Weekly New Scholarship Scout

on:
  schedule:
    - cron: '15 3 * * 3' # Wednesday 3:15 AM UTC (Runs Wednesday 8:45 AM IST)
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  scout:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scholarship-app/package-lock.json

      - name: Install dependencies
        run: |
          cd scholarship-app
          npm ci

      # Read-only: the scout needs the current list of scholarships to spot new ones
      - name: Pull latest database from Turso
        run: node scholarship-app/scripts/pull-from-turso.js
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Discover New Scholarships (Gemini Flash)
        id: scout
        run: |
          node scholarship-app/scripts/scholarship-scout.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NODE_ENV: production

      - name: Open Review Pull Request
        id: pr
        if: steps.scout.outputs.candidates != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: scout/new-scholarships
          add-paths: scholarship-app/data/scout/**
          commit-message: "feat: scout found new scholarships for review"
          title: "🔭 Scholarship Scout: ${{ steps.scout.outputs.candidates }} new scholarship(s) to review"
          body-path: scholarship-app/data/scout/scout-report.md
          labels: scholarship-scout
          delete-branch: true

      - name: Send Email Notification
        if: steps.pr.outputs.pull-request-url != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Scholarship Scout: ${{ steps.scout.outputs.candidates }} new scholarship(s) to review"
          to: bizmantra@gmail.com
          from: "India Scholarships Scout <${{ secrets.EMAIL_USERNAME }}>"
          secure: true
          body: |
            The weekly scout found ${{ steps.scout.outputs.candidates }} scholarship(s) that are not yet on the site.

            Review and approve them here:
            ${{ steps.pr.outputs.pull-request-url }}

            Merge the pull request to publish them. Close it to reject them all.
