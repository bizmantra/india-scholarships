name: Publish Scout-Approved Scholarships

on:
  push:
    branches: [ main ]
    paths:
      - 'scholarship-app/data/scout/candidates/**'
  workflow_dispatch: # Allows manual triggering from GitHub UI

# Wait for any other run of this workflow so two publishes never race on the database file
concurrency:
  group: database-writes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scholarship-app/package-lock.json

      - name: Install dependencies
        run: |
          cd scholarship-app
          npm ci

      - name: Insert Approved Scholarships
        run: |
          node scholarship-app/scripts/publish-scout-approved.js

      - name: Normalize data formats
        run: node scholarship-app/scripts/clean-data-formats.js

      - name: Check data formats (blocks bad data from reaching Turso)
        run: node scholarship-app/scripts/check-data-formats.js

      - name: Check for database changes
        id: commit
        run: |
          if git diff --quiet -- scholarship-app/data/scholarships.db; then
            echo "No database changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Back up Turso before syncing
        if: steps.commit.outputs.changed == 'true'
        run: node scholarship-app/scripts/backup-turso.js --out=backups/pre-sync.db
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Store pre-sync backup
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pre-sync-backup-production-${{ github.run_id }}
          path: backups/pre-sync.db
          retention-days: 7

      - name: Push Database to Turso
        if: steps.commit.outputs.changed == 'true'
        run: |
          node scholarship-app/scripts/push-to-turso.js
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Broadcast New Entries to Telegram
        if: steps.commit.outputs.changed == 'true'
        run: |
          node scholarship-app/scripts/post-new-to-telegram.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          NODE_ENV: production

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholarship-app/data/scholarships.db scholarship-app/data/format-exceptions.json scholarship-app/data/scout scholarship-app/data/telegram-posted.json
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: publish scout-approved scholarships [skip ci]"
            git push origin main
          fi

      - name: Trigger Vercel Redeployment
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
