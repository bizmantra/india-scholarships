name: Weekly Maintenance
# Search data refresh, content audit, format clean-up and Telegram. The old AI research step was removed on
# 2026-09-27: it re-wrote page text without approval. Checking facts is now the Fact Check agent's job.
# The request id lets the command center find the run it started
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Weekly Maintenance · {0}{1}', inputs.target, inputs.request_id && format(' · {0}', inputs.request_id) || '') || github.workflow }}"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Sunday midnight UTC (Runs Sunday 5:30 AM IST)
  workflow_dispatch: # Allows manual triggering from GitHub UI
    inputs:
      target:
        description: 'Database to update (staging = test run: live site untouched)'
        type: choice
        options: [production, staging]
        default: production
      request_id:
        description: 'Set by the command center to track this run (leave empty)'
        type: string
        required: false
        default: ''

# Scheduled/manual runs write the database, so they share one queue with the other database writers
concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('database-writes{0}', inputs.target == 'staging' && '-staging' || '') || format('weekly-audit-{0}', github.ref) }}
  cancel-in-progress: false

env:
  DB_TARGET: ${{ inputs.target || 'production' }}

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scholarship-app/package-lock.json

      - name: Install dependencies
        run: |
          cd scholarship-app
          npm ci

      # Turso is the master copy: start from its latest data (push/PR runs only read it for the audits)
      - name: Pull latest database from Turso
        run: node scholarship-app/scripts/pull-from-turso.js
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_STAGING_DATABASE_URL: ${{ secrets.TURSO_STAGING_DATABASE_URL }}
          TURSO_STAGING_AUTH_TOKEN: ${{ secrets.TURSO_STAGING_AUTH_TOKEN }}

      - name: Sync Google Search Console Live Traffic Cache
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          node scholarship-app/scripts/sync-gsc-cache.js
        env:
          GOOGLE_SERVICES_CLIENT_EMAIL: ${{ secrets.GOOGLE_SERVICES_CLIENT_EMAIL }}
          GOOGLE_SERVICES_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICES_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          NODE_ENV: production

      # Report only, never blocks. This audit checks the live database, not the code in the PR, so it
      # failed every PR as soon as any deadline passed. Data gaps are fixed through the admin inbox
      # (quality fixer, fact check, freshness check), where the owner approves each change.
      - name: Run Content Quality Audit (report only)
        run: |
          node scholarship-app/scripts/content-quality-audit.js
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            sed -n '1,/^## 🔍/p' scholarship-app/data/content-quality-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          NODE_ENV: production

      - name: Run Article Links Validation
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          node scholarship-app/scripts/audit-article-links.js --strict
        env:
          NODE_ENV: production

      # On push/PR runs this only fixes the local copy (nothing is pushed), so the check below can pass
      - name: Normalize data formats
        run: node scholarship-app/scripts/clean-data-formats.js

      - name: Check data formats (blocks bad data from reaching Turso)
        run: node scholarship-app/scripts/check-data-formats.js

      - name: Back up Turso before syncing
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scholarship-app/scripts/backup-turso.js --out=backups/pre-sync.db
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_STAGING_DATABASE_URL: ${{ secrets.TURSO_STAGING_DATABASE_URL }}
          TURSO_STAGING_AUTH_TOKEN: ${{ secrets.TURSO_STAGING_AUTH_TOKEN }}

      - name: Store pre-sync backup
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pre-sync-backup-${{ env.DB_TARGET }}-${{ github.run_id }}
          path: backups/pre-sync.db
          retention-days: 7

      - name: Push Database to Turso
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          node scholarship-app/scripts/push-to-turso.js
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_STAGING_DATABASE_URL: ${{ secrets.TURSO_STAGING_DATABASE_URL }}
          TURSO_STAGING_AUTH_TOKEN: ${{ secrets.TURSO_STAGING_AUTH_TOKEN }}

      - name: Broadcast New Entries to Telegram
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && env.DB_TARGET == 'production'
        run: |
          node scholarship-app/scripts/post-new-to-telegram.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          NODE_ENV: production

      - name: Commit reports and Telegram registry
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && env.DB_TARGET == 'production'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholarship-app/data/content-quality-report.md scholarship-app/data/content-quality-audit.csv scholarship-app/data/telegram-posted.json
          if git diff --staged --quiet; then
            echo "No report changes. Skipping commit."
          else
            git commit -m "chore: automated weekly data enrichment & audit [skip ci]"
            # The code may have moved on during a long run: catch up first, so the save is never rejected
            git pull --rebase origin main
            git push origin main
          fi

      - name: Trigger Vercel Redeployment
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && env.DB_TARGET == 'production'
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
