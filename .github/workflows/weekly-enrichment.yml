name: Weekly Scholarship Data Enrichment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Sunday midnight UTC (Runs Sunday 5:30 AM IST)
  workflow_dispatch: # Allows manual triggering from GitHub UI
    inputs:
      target:
        description: 'Database to update (staging = test run: live site untouched)'
        type: choice
        options: [production, staging]
        default: production

# Scheduled/manual runs write the database, so they share one queue with the other database writers
concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'database-writes' || format('weekly-audit-{0}', github.ref) }}
  cancel-in-progress: false

env:
  DB_TARGET: ${{ inputs.target || 'production' }}

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scholarship-app/package-lock.json

      - name: Install dependencies
        run: |
          cd scholarship-app
          npm ci

      # Turso is the master copy: start from its latest data (push/PR runs only read it for the audits)
      - name: Pull latest database from Turso
        run: node scholarship-app/scripts/pull-from-turso.js
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_STAGING_DATABASE_URL: ${{ secrets.TURSO_STAGING_DATABASE_URL }}
          TURSO_STAGING_AUTH_TOKEN: ${{ secrets.TURSO_STAGING_AUTH_TOKEN }}

      - name: Sync Google Search Console Live Traffic Cache
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          node scholarship-app/scripts/sync-gsc-cache.js
        env:
          GOOGLE_SERVICES_CLIENT_EMAIL: ${{ secrets.GOOGLE_SERVICES_CLIENT_EMAIL }}
          GOOGLE_SERVICES_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICES_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          NODE_ENV: production

      - name: Run Grounding Enrichment (Gemini Flash)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          node scholarship-app/scripts/enrich-all-low-ctr-gemini.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NODE_ENV: production

      - name: Run Content Quality Audit
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Running strict verification check..."
            node scholarship-app/scripts/content-quality-audit.js --strict
          else
            node scholarship-app/scripts/content-quality-audit.js
          fi
        env:
          NODE_ENV: production

      - name: Run Article Links Validation
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          node scholarship-app/scripts/audit-article-links.js --strict
        env:
          NODE_ENV: production

      - name: Generate Weekly Email Body
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          node scholarship-app/scripts/generate-email-reports.js --type weekly

      - name: Send Email Report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Weekly Scholarship Enrichment Report"
          to: bizmantra@gmail.com
          from: "India Scholarships Freshness Pipeline <${{ secrets.EMAIL_USERNAME }}>"
          secure: true
          html_body: file://${{ github.workspace }}/scholarship-app/data/weekly-email-body.html

      # On push/PR runs this only fixes the local copy (nothing is pushed), so the check below can pass
      - name: Normalize data formats
        run: node scholarship-app/scripts/clean-data-formats.js

      - name: Check data formats (blocks bad data from reaching Turso)
        run: node scholarship-app/scripts/check-data-formats.js

      - name: Back up Turso before syncing
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scholarship-app/scripts/backup-turso.js --out=backups/pre-sync.db
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_STAGING_DATABASE_URL: ${{ secrets.TURSO_STAGING_DATABASE_URL }}
          TURSO_STAGING_AUTH_TOKEN: ${{ secrets.TURSO_STAGING_AUTH_TOKEN }}

      - name: Store pre-sync backup
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pre-sync-backup-${{ env.DB_TARGET }}-${{ github.run_id }}
          path: backups/pre-sync.db
          retention-days: 7

      - name: Push Database to Turso
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          node scholarship-app/scripts/push-to-turso.js
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_STAGING_DATABASE_URL: ${{ secrets.TURSO_STAGING_DATABASE_URL }}
          TURSO_STAGING_AUTH_TOKEN: ${{ secrets.TURSO_STAGING_AUTH_TOKEN }}

      - name: Broadcast New Entries to Telegram
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && env.DB_TARGET == 'production'
        run: |
          node scholarship-app/scripts/post-new-to-telegram.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          NODE_ENV: production

      - name: Commit reports and Telegram registry
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && env.DB_TARGET == 'production'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholarship-app/data/content-quality-report.md scholarship-app/data/content-quality-audit.csv scholarship-app/data/telegram-posted.json
          if git diff --staged --quiet; then
            echo "No report changes. Skipping commit."
          else
            git commit -m "chore: automated weekly data enrichment & audit [skip ci]"
            git push origin main
          fi

      - name: Trigger Vercel Redeployment
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && env.DB_TARGET == 'production'
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
