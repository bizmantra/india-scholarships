name: Morning Briefing
# The request id lets the Agent Center find the run it started
run-name: "Morning Briefing · ${{ inputs.target || 'production' }}${{ inputs.request_id && format(' · {0}', inputs.request_id) || '' }}"

on:
  schedule:
    - cron: '30 2 * * *' # 2:30 AM UTC (8:00 AM IST), after the night's agent runs and the 7 AM freshness check
  workflow_dispatch: # Started from the Agent Center or the GitHub UI
    inputs:
      target:
        description: 'Database to read (staging = test run)'
        type: choice
        options: [production, staging]
        default: production
      request_id:
        description: 'Set by the Agent Center to track this run (leave empty)'
        type: string
        required: false
        default: ''

# The briefing only adds one activity entry, which is safe next to another agent's sync (new rows get fresh ids),
# so it does not queue behind long agent runs; it only avoids overlapping with itself
concurrency:
  group: morning-briefing-${{ inputs.target || 'production' }}
  cancel-in-progress: false

env:
  DB_TARGET: ${{ inputs.target || 'production' }}

jobs:
  briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to list the last day's agent runs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scholarship-app/package-lock.json

      - name: Install dependencies
        run: |
          cd scholarship-app
          npm ci

      - name: Pull latest database from Turso
        run: node scholarship-app/scripts/pull-from-turso.js
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_STAGING_DATABASE_URL: ${{ secrets.TURSO_STAGING_DATABASE_URL }}
          TURSO_STAGING_AUTH_TOKEN: ${{ secrets.TURSO_STAGING_AUTH_TOKEN }}

      - name: Write the briefing
        id: briefing
        run: node scholarship-app/scripts/morning-briefing.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Only the new activity entry is sent; scholarship data is not touched
      - name: Save the briefing to the activity feed
        run: node scholarship-app/scripts/push-to-turso.js
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_STAGING_DATABASE_URL: ${{ secrets.TURSO_STAGING_DATABASE_URL }}
          TURSO_STAGING_AUTH_TOKEN: ${{ secrets.TURSO_STAGING_AUTH_TOKEN }}

      - name: Email the briefing
        if: steps.briefing.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: ${{ steps.briefing.outputs.subject }}
          to: bizmantra@gmail.com
          from: "India Scholarships Agents <${{ secrets.EMAIL_USERNAME }}>"
          secure: true
          html_body: file://${{ github.workspace }}/scholarship-app/data/morning-briefing.html
