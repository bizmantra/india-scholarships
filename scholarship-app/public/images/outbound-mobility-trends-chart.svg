<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title-mob desc-mob">
  <title id="title-mob">Outbound Indian Student Mobility Trends</title>
  <desc id="desc-mob">Bar chart comparing annual outbound student flows: 1.3 Million students in 2024 peak, and 626,000 students in 2025.</desc>
  
  <rect width="900" height="450" fill="#ffffff" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <text x="50" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Outbound Indian Student Flow (2024-2025)</text>
  <text x="50" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">Total number of Indian students traveling abroad for studies (Lakh Students)</text>

  <!-- 2024 Peak -->
  <text x="50" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">2024 Academic Year (Outbound Peak)</text>
  <rect x="50" y="150" width="650" height="40" rx="6" fill="url(#pink-grad)"/>
  <text x="715" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#9f1239">13.0 Lakh (1,300,000)</text>

  <!-- 2025 Consolidation -->
  <text x="50" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">2025 Academic Year (Consolidation Period)</text>
  <rect x="50" y="250" width="313" height="40" rx="6" fill="url(#blue-grad)"/>
  <text x="378" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#1d4ed8">6.26 Lakh (626,000)</text>

  <!-- Footer Info -->
  <line x1="50" y1="360" x2="850" y2="360" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Source: Ministry of Education, Government of India (Provisional Outbound Mobility Records)</text>
  <text x="760" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">IndiaScholarships.in</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="pink-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
</svg>
