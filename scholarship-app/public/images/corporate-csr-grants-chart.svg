<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title-corp desc-corp">
  <title id="title-corp">Private &amp; Corporate Scholarship Grant Limits</title>
  <desc id="desc-corp">Bar chart comparing private scholarship values: Reliance Foundation Postgraduate at 6 Lakhs, Reliance Undergraduate at 2 Lakhs, HDFC Parivartan Professional Postgraduate at 75,000, and HDFC Professional Undergraduate at 50,000.</desc>
  
  <rect width="900" height="450" fill="#ffffff" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <text x="50" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Corporate &amp; Private Scholarship Grant Sizes</text>
  <text x="50" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">Comparison of maximum annual funding limits per student (₹ Rupees)</text>

  <!-- Reliance PG -->
  <text x="50" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Reliance Foundation Postgraduate Scholarship</text>
  <rect x="50" y="140" width="600" height="28" rx="5" fill="url(#reliance-grad)"/>
  <text x="665" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#4c1d95">₹6,00,000</text>

  <!-- Reliance UG -->
  <text x="50" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Reliance Foundation Undergraduate Scholarship</text>
  <rect x="50" y="205" width="200" height="28" rx="5" fill="url(#reliance-grad)"/>
  <text x="265" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#4c1d95">₹2,00,000</text>

  <!-- HDFC Professional PG -->
  <text x="50" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">HDFC Parivartan ECSS (Professional PG Limit)</text>
  <rect x="50" y="270" width="75" height="28" rx="5" fill="url(#hdfc-grad)"/>
  <text x="140" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#1d4ed8">₹75,000</text>

  <!-- HDFC Professional UG -->
  <text x="50" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">HDFC Parivartan ECSS (Professional UG Limit)</text>
  <rect x="50" y="335" width="50" height="28" rx="5" fill="url(#hdfc-grad)"/>
  <text x="115" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#1d4ed8">₹50,000</text>

  <!-- Footer Info -->
  <line x1="50" y1="390" x2="850" y2="390" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Source: Reliance Foundation Scholarship Announcement and HDFC Bank Parivartan ECSS program details</text>
  <text x="760" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">IndiaScholarships.in</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="reliance-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="hdfc-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
</svg>
