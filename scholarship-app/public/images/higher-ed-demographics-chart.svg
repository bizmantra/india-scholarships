<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title-demo desc-demo">
  <title id="title-demo">Higher Education Student Enrollment Demographics (AISHE)</title>
  <desc id="desc-demo">Bar chart comparing Higher Education enrollment categories: Female Student Enrollment at 22.4 Million, OBC Enrollment at 18 Million, SC Student Enrollment at 6.97 Million, and ST Student Enrollment at 2.88 Million.</desc>
  
  <rect width="900" height="450" fill="#ffffff" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <text x="50" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Higher Education Enrollment Demographics</text>
  <text x="50" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">Comparison of national enrollment figures (Million Students)</text>

  <!-- Female Enrolment -->
  <text x="50" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Female Student Enrollment (Total)</text>
  <rect x="50" y="140" width="560" height="28" rx="5" fill="url(#pink-grad)"/>
  <text x="625" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#9f1239">22.40 Million</text>

  <!-- OBC Enrolment -->
  <text x="50" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Other Backward Classes (OBC) Enrollment</text>
  <rect x="50" y="205" width="450" height="28" rx="5" fill="url(#blue-grad)"/>
  <text x="515" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#1d4ed8">18.00 Million</text>

  <!-- SC Enrolment -->
  <text x="50" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Scheduled Caste (SC) Enrollment</text>
  <rect x="50" y="270" width="174" height="28" rx="5" fill="url(#teal-grad)"/>
  <text x="239" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#0f766e">6.97 Million</text>

  <!-- ST Enrolment -->
  <text x="50" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Scheduled Tribe (ST) Enrollment</text>
  <rect x="50" y="335" width="72" height="28" rx="5" fill="url(#orange-grad)"/>
  <text x="137" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#b45309">2.88 Million</text>

  <!-- Footer Info -->
  <line x1="50" y1="390" x2="850" y2="390" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Source: All India Survey on Higher Education (AISHE Census Report, Ministry of Education, published July 2026)</text>
  <text x="760" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">IndiaScholarships.in</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="pink-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
</svg>
