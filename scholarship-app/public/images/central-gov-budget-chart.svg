<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title-gov desc-gov">
  <title id="title-gov">Central Government Scholarship Allocations FY 2026-2027</title>
  <desc id="desc-gov">Bar chart comparing central education scholarship schemes: PM-USP at 1,560 Crore, Doctoral Fellowships at 600 Crore, and NMMSS at 381 Crore.</desc>
  
  <!-- Clean white background -->
  <rect width="900" height="450" fill="#ffffff" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Grid Lines -->
  <line x1="300" y1="100" x2="300" y2="350" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="450" y1="100" x2="450" y2="350" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="600" y1="100" x2="600" y2="350" stroke="#f1f5f9" stroke-width="1"/>
  <line x1="750" y1="100" x2="750" y2="350" stroke="#f1f5f9" stroke-width="1"/>
  
  <text x="50" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Central Scholarship Allocations (FY27)</text>
  <text x="50" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">Budget outlays for major central education funding schemes (₹ Crore)</text>

  <!-- Bar 1: PM-USP -->
  <text x="50" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">PM-USP (Scholarships &amp; Subsidies)</text>
  <rect x="50" y="140" width="600" height="36" rx="6" fill="url(#blue-grad)"/>
  <text x="665" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#1d4ed8">₹1,560 Cr</text>

  <!-- Bar 2: Doctoral Fellowship -->
  <text x="50" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Doctoral Fellowships Budget</text>
  <rect x="50" y="220" width="230" height="36" rx="6" fill="url(#teal-grad)"/>
  <text x="295" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0f766e">₹600 Cr</text>

  <!-- Bar 3: NMMSS Scheme -->
  <text x="50" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">National Means-cum-Merit Scheme (NMMSS)</text>
  <rect x="50" y="300" width="146" height="36" rx="6" fill="url(#slate-grad)"/>
  <text x="211" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#475569">₹381 Cr</text>

  <!-- Footer Info -->
  <line x1="50" y1="380" x2="850" y2="380" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Source: Union Budget of India (Demand for Grants for Ministry of Education)</text>
  <text x="760" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">IndiaScholarships.in</text>

  <!-- Professional Corporate Gradients -->
  <defs>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="slate-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
</svg>
