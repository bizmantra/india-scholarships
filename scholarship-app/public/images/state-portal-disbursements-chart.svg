<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title-funnel desc-funnel">
  <title id="title-funnel">UP Saksham Scholarship Application Funnel (FY26)</title>
  <desc id="desc-funnel">Funnel chart showing Uttar Pradesh Saksham portal application drop-offs: 89.89 Lakh OTR registrations, 84.88 Lakh final submissions, 77.08 Lakh institution approvals, and 18.64 Lakh paid beneficiaries.</desc>
  
  <rect width="900" height="450" fill="#ffffff" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <text x="50" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">UP Saksham Portal Application Funnel</text>
  <text x="50" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">Volume drop-off from OTR registration to final DBT payment (Lakh Students)</text>

  <!-- Funnel Stage 1: OTR -->
  <rect x="250" y="120" width="400" height="32" rx="4" fill="#1e3a8a" opacity="0.95"/>
  <text x="70" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">1. OTR Registrations</text>
  <text x="665" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#1e3a8a">89.89 Lakh (100%)</text>

  <!-- Funnel Stage 2: Final Submitted -->
  <rect x="262" y="175" width="376" height="32" rx="4" fill="#2563eb" opacity="0.95"/>
  <text x="70" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">2. Submitted Forms</text>
  <text x="665" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#2563eb">84.88 Lakh (94.4%)</text>

  <!-- Funnel Stage 3: Forwarded by Colleges -->
  <rect x="278" y="230" width="344" height="32" rx="4" fill="#0f766e" opacity="0.95"/>
  <text x="70" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">3. College Verified</text>
  <text x="665" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#0f766e">77.08 Lakh (85.7%)</text>

  <!-- Funnel Stage 4: Paid Beneficiaries -->
  <rect x="375" y="285" width="150" height="32" rx="4" fill="#059669" opacity="0.95"/>
  <text x="70" y="307" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">4. DBT Paid Beneficiaries</text>
  <text x="665" y="307" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#059669">18.64 Lakh (20.7%)</text>

  <!-- Footer Info -->
  <line x1="50" y1="375" x2="850" y2="375" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Source: Saksham Portal Official Dashboard (Uttar Pradesh State Government, July 2026 data)</text>
  <text x="760" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">IndiaScholarships.in</text>
</svg>
