<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title-intl desc-intl">
  <title id="title-intl">Indian Student Quotas for Elite International Scholarships</title>
  <desc id="desc-intl">Bar chart comparing international scholarship slots: National Overseas Scholarship for SC at 250 slots, Erasmus Mundus at 75 slots, National Overseas Scholarship for ST at 50 slots, and Rhodes Scholarship at 6 slots.</desc>
  
  <rect width="900" height="450" fill="#ffffff" rx="16" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <text x="50" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Elite International Scholarship Slots (India)</text>
  <text x="50" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">Number of annual selection slots allocated for Indian students</text>

  <!-- NOS SC -->
  <text x="50" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">National Overseas Scholarship for SC (FY27 target)</text>
  <rect x="50" y="140" width="500" height="28" rx="5" fill="url(#indigo-grad)"/>
  <text x="565" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#4338ca">250 Slots</text>

  <!-- Erasmus Mundus -->
  <text x="50" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Erasmus Mundus Joint Masters Scholarship (2026 Cohort)</text>
  <rect x="50" y="205" width="150" height="28" rx="5" fill="url(#teal-grad)"/>
  <text x="215" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#0f766e">75 Slots</text>

  <!-- NOS ST -->
  <text x="50" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">National Overseas Scholarship for ST (FY27 target)</text>
  <rect x="50" y="270" width="100" height="28" rx="5" fill="url(#blue-grad)"/>
  <text x="165" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#1d4ed8">50 Slots</text>

  <!-- Rhodes -->
  <text x="50" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Rhodes Scholarships - India (2026 Intake)</text>
  <rect x="50" y="335" width="12" height="28" rx="5" fill="url(#gold-grad)"/>
  <text x="75" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#b45309">6 Slots</text>

  <!-- Footer Info -->
  <line x1="50" y1="390" x2="850" y2="390" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Source: Ministry of Tribal Affairs, Ministry of Social Justice and Empowerment, European Union Delegation to India, Rhodes Trust</text>
  <text x="760" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">IndiaScholarships.in</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="indigo-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
</svg>
